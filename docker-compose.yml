services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wp_core:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/morgane

  # One-shot: installs WP + WooCommerce + activates theme + sample data.
  # Run:  docker compose run --rm wpcli
  # profiles keeps it out of `docker compose up` (only runs when invoked).
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    # Match the apache container's www-data (UID 33) that owns wp-content,
    # otherwise wp-cli can't write plugins/uploads.
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - wp_core:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/morgane
      - ./scripts:/scripts
      # Photos d'origine, lues une seule fois par media.php qui les convertit
      # en WebP dans la médiathèque. En lecture seule : rien n'y est réécrit.
      - ./pictures:/pictures:ro
      # Sortie de l'export vers Shopify (scripts/export-shopify.php).
      - ./dist:/dist
    entrypoint: ["/bin/sh", "/scripts/setup.sh"]

volumes:
  db_data:
  wp_core:
